# Real-Time Fraud Detection System Configuration

project:
  name: "Real-Time Fraud Detection System"
  version: "1.0.0"
  description: "AI/ML-powered real-time transaction fraud detection"

data:
  n_samples: 500000
  fraud_ratio: 0.015          # 1.5% fraud rate (realistic)
  n_users: 10000
  n_merchants: 5000
  random_state: 42
  raw_path: "data/raw/transactions.csv"
  processed_path: "data/processed/transactions_processed.csv"
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"

features:
  numerical:
    - "amount"
    - "hour_of_day"
    - "day_of_week"
    - "is_weekend"
    - "amount_log"
    - "txn_velocity_1h"
    - "txn_velocity_24h"
    - "txn_velocity_7d"
    - "amount_deviation"
    - "amount_to_avg_ratio"
    - "unique_merchants_24h"
    - "distance_from_home_km"
    - "is_international"
    - "is_online"
    - "card_present"
    - "failed_attempts_24h"
    - "account_age_days"
    - "time_since_last_txn_min"
  categorical:
    - "merchant_category"
    - "transaction_type"
    - "device_type"
  target: "is_fraud"

models:
  output_dir: "models/artifacts"
  logistic_regression:
    C: 0.1
    max_iter: 1000
    class_weight: "balanced"
  random_forest:
    n_estimators: 300
    max_depth: 15
    min_samples_split: 5
    class_weight: "balanced"
    n_jobs: -1
    random_state: 42
  xgboost:
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 66    # ~ (1-fraud_ratio)/fraud_ratio
    random_state: 42
  lightgbm:
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.05
    num_leaves: 63
    class_weight: "balanced"
    random_state: 42
  neural_network:
    hidden_layer_sizes: [256, 128, 64]
    activation: "relu"
    max_iter: 200
    random_state: 42
  isolation_forest:
    n_estimators: 200
    contamination: 0.015
    random_state: 42
  ensemble:
    voting: "soft"

training:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  smote: true
  cross_validation_folds: 5
  threshold: 0.5
  optimal_threshold: true     # find threshold maximizing F1

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "pr_auc"
    - "average_precision"
  plots_dir: "models/plots"
  reports_dir: "models/reports"

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 4
  model_path: "models/artifacts/best_model.pkl"
  threshold: 0.5
  high_risk_threshold: 0.8

pipeline:
  batch_size: 100
  processing_interval_seconds: 1
  alert_threshold: 0.7
  max_queue_size: 10000

dashboard:
  host: "0.0.0.0"
  port: 8501
  api_url: "http://localhost:8000"
  refresh_interval_seconds: 5

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  file: "logs/fraud_detection.log"
  rotation: "10 MB"
  retention: "30 days"
